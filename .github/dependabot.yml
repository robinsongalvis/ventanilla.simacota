# Gestión automática de dependencias (P1.2 del roadmap a v1.0).
# Adelanta los advisories de seguridad y agrupa las actualizaciones de versión
# para evitar el parcheo manual reactivo (3 advisories en una semana, jul 2026).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Los grupos solo agrupan minor/patch (seguros). Las actualizaciones
      # MAYORES llegan como PR individuales para revisarse una a una — un mayor
      # (typescript 5→7, firebase-admin 13→14, eslint 9→10) puede romper el build
      # y no debe mezclarse con parches en un PR de "todo o nada".
      produccion:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      desarrollo:
        dependency-type: "development"
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
