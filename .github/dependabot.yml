# Gestión automática de dependencias (P1.2 del roadmap a v1.0).
# Adelanta los advisories de seguridad y agrupa las actualizaciones de versión
# para evitar el parcheo manual reactivo (3 advisories en una semana, jul 2026).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      produccion:
        dependency-type: "production"
      desarrollo:
        dependency-type: "development"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
