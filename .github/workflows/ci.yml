name: CI/CD Pipeline - Ventanilla Única Simacota

on:
  push:
    branches: [ main, develop, release/fase5-hardening ]
  pull_request:
    # pr1-base y pr2-h3 son las bases del stack de release de H3 (PR apilados):
    # se añaden SOLO al trigger para que los PR contra ellas corran los mismos
    # checks que un PR contra main. No cambia el comportamiento para main.
    branches: [ main, develop, release/fase5-hardening, pr1-base, pr2-h3 ]

# ── Runtime pinning (G2, ADR-0025) ───────────────────────────────────────────
# La versión de Node se fija en `.nvmrc` (fuente única; los jobs la leen con
# `node-version-file`) y se documenta en `engines` de package.json.
# El runtime de producción (Vercel) corre con `require(esm)` DESACTIVADO; esa
# condición se emula en CI mediante el gate G1
# (`__tests__/regresion-esm-require-firebase-admin.test.ts`), que fuerza
# `--no-experimental-require-module` en procesos HIJO dentro de `npm test`.
# NO se fija ese flag como NODE_OPTIONS global del job: rompe el propio runner de
# vitest (ERR_REQUIRE_ESM, verificado localmente en Node 24). La protección la da
# el flag vía G1, no la versión de Node (CI corre 22; Vercel, 24).
jobs:
  validate:
    name: Build & Security Gates
    runs-on: ubuntu-latest
    # Los pasos de control corren con `if: ${{ !cancelled() }}` para que TODOS
    # se ejecuten aunque uno falle: así el informe de despliegue (job final,
    # ADR-0013/2D) recibe una señal COMPLETA por categoría. Un paso en rojo sigue
    # poniendo el job en rojo (no lleva continue-on-error) — la compuerta no se
    # debilita.
    outputs:
      lint: ${{ steps.lint.outcome }}
      tsc: ${{ steps.tsc.outcome }}
      test: ${{ steps.test.outcome }}
      presupuesto: ${{ steps.presupuesto.outcome }}
      indices: ${{ steps.indices.outcome }}
      audit: ${{ steps.audit.outcome }}
      build: ${{ steps.build.outcome }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Lint Check (Linter Gate)
        id: lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: TypeScript Compile Check (Type Gate)
        id: tsc
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      - name: Test Suite (Quality Gate)
        id: test
        if: ${{ !cancelled() }}
        run: npm test

      - name: Presupuesto de Rendimiento (R11 Gate — ADR-0011, 2B)
        id: presupuesto
        if: ${{ !cancelled() }}
        # Control de regresión de escala: falla si una consulta de colección
        # sobre `ventanilla_radicados` que debe estar acotada pierde su
        # limit()/cursor (regresión O(N)), o si aparece una lectura ilimitada
        # nueva sin clasificar. Estático y determinista — no requiere emulador.
        run: npm run presupuesto:rendimiento

      - name: Índices Firestore (Gate de consultas compuestas)
        id: indices
        if: ${{ !cancelled() }}
        # Lección del incidente del Reparto: una consulta where()+orderBy()
        # sin índice compuesto declarado rompió una pantalla en producción
        # (FAILED_PRECONDITION), y ni los tests ni el emulador lo exigen.
        # Estático y determinista — no requiere emulador.
        run: npm run verificar:indices

      - name: Security Scan (NPM Audit Gate — GOBERNADO, ADR-0028)
        id: audit
        if: ${{ !cancelled() }}
        # Gate de auditoría GOBERNADO (reemplaza `npm audit --audit-level=high`
        # crudo): sigue fallando ante CUALQUIER advisory high/critical nueva,
        # pero permite declarar en `audit-allowlist.json` excepciones puntuales,
        # con caducidad (≤90 días) y responsable, para transitivas sin fix
        # upstream — rompe el hard-deadlock del branch protection sin debilitar
        # el gate. Su `outcome` alimenta la Compuerta de gobernanza (ADR-0013),
        # que sigue leyendo `steps.audit.outcome` sin cambios.
        run: node scripts/ci/audit-gate.mjs

      - name: Production Build Check (Build Gate)
        id: build
        if: ${{ !cancelled() }}
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

  laboratorio-emulador:
    name: Laboratorio - Emulador Firestore (Fase 1)
    runs-on: ubuntu-latest
    outputs:
      sonda: ${{ steps.sonda.outcome }}
      matriz: ${{ steps.matriz.outcome }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Java (emulador)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Emulador + reglas + sonda canario
        id: sonda
        if: ${{ !cancelled() }}
        run: npx firebase-tools emulators:exec --only firestore --project demo-ventanilla-lab "node scripts/laboratorio/probar-emulador.mjs"

      - name: Matriz de aislamiento por tenant (ADR-0007)
        id: matriz
        if: ${{ !cancelled() }}
        run: npx firebase-tools emulators:exec --only firestore --project demo-ventanilla-lab "npm run test:rules"

  informe-despliegue:
    name: Compuerta de despliegue — Informe de gobernanza (ADR-0013, 2D)
    runs-on: ubuntu-latest
    needs: [ validate, laboratorio-emulador ]
    # Corre SIEMPRE (salvo cancelación) para emitir el informe COMPLETO aunque
    # algún job de control haya fallado. El propio informe decide su exit code:
    # ROJO → exit 1 (con branch protection, bloquea el merge); AMBER/VERDE → exit 0.
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Generar informe de despliegue (semáforo + veredicto)
        run: node scripts/laboratorio/informe-despliegue.mjs
        env:
          INFORME_DIR: ${{ github.workspace }}/informe
          # Outcomes de los controles → categorías (ADR-0013 §Decisión.2).
          OUTCOME_LINT: ${{ needs.validate.outputs.lint }}
          OUTCOME_TSC: ${{ needs.validate.outputs.tsc }}
          OUTCOME_TEST: ${{ needs.validate.outputs.test }}
          OUTCOME_PRESUPUESTO: ${{ needs.validate.outputs.presupuesto }}
          OUTCOME_INDICES: ${{ needs.validate.outputs.indices }}
          OUTCOME_AUDIT: ${{ needs.validate.outputs.audit }}
          OUTCOME_BUILD: ${{ needs.validate.outputs.build }}
          OUTCOME_MATRIZ: ${{ needs.laboratorio-emulador.outputs.matriz }}
          OUTCOME_SONDA: ${{ needs.laboratorio-emulador.outputs.sonda }}

      - name: Publicar informe como artefacto (trazabilidad)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: informe-despliegue-${{ github.sha }}
          path: informe/
          if-no-files-found: warn
