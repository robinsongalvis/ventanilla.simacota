name: CI/CD Pipeline - Ventanilla Única Simacota

on:
  push:
    branches: [ main, develop, release/fase5-hardening ]
  pull_request:
    branches: [ main, develop, release/fase5-hardening ]

jobs:
  validate:
    name: Build & Security Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Lint Check (Linter Gate)
        run: npm run lint

      - name: TypeScript Compile Check (Type Gate)
        run: npx tsc --noEmit

      - name: Test Suite (Quality Gate)
        run: npm test

      - name: Security Scan (NPM Audit Gate)
        run: npm audit --audit-level=high

      - name: Production Build Check (Build Gate)
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

  laboratorio-emulador:
    name: Laboratorio - Emulador Firestore (Fase 1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java (emulador)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Emulador + reglas + sonda canario
        run: npx firebase-tools emulators:exec --only firestore --project demo-ventanilla-lab "node scripts/laboratorio/probar-emulador.mjs"

      - name: Matriz de aislamiento por tenant (ADR-0007)
        run: npx firebase-tools emulators:exec --only firestore --project demo-ventanilla-lab "npm run test:rules"
