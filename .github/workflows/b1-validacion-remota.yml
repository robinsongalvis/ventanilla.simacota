name: B1 — validación remota exacta del candidato

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  deployments: read

jobs:
  validar-candidato-exacto:
    if: >-
      github.event.label.name == 'run-b1-stage-e2e' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: stage-e2e
    timeout-minutes: 50
    concurrency:
      group: b1-validacion-54256f5
      cancel-in-progress: false
    env:
      CANDIDATE_SHA: 54256f54cf1ad0cd1b3c61e59fc3c1424889e3f9
      PREVIEW_URL: https://ventanilla-simacota-6qaz5ct8o-robinsongalvis-projects.vercel.app
      STAGE_PROJECT_ID: ventanilla-simacota-stage

    steps:
      - name: Verificar que el disparo es la validación B1 esperada
        run: |
          test "${{ github.event.pull_request.base.ref }}" = "release/fase5-hardening"
          echo "PR #${{ github.event.pull_request.number }} autorizado para validación B1."

      - name: Checkout literal del candidato
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Probar identidad exacta del candidato
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          echo "SHA probado: $ACTUAL"

      - name: Verificar que el preview pertenece al SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .b1-artifacts
          DESPLIEGUES="$(mktemp)"
          ESTADOS="$(mktemp)"
          trap 'rm -f "$DESPLIEGUES" "$ESTADOS"' EXIT
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/deployments?sha=${CANDIDATE_SHA}" \
            > "$DESPLIEGUES"
          URL_ESTADOS="$(jq -r '.[] | select(.environment == "Preview") | .statuses_url' "$DESPLIEGUES" | head -n 1)"
          test -n "$URL_ESTADOS"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$URL_ESTADOS" > "$ESTADOS"
          URL_REAL="$(jq -r '.[] | select(.state == "success") | .environment_url' "$ESTADOS" | head -n 1)"
          test "$URL_REAL" = "$PREVIEW_URL"
          printf 'preview=%s\nsha=%s\n' "$URL_REAL" "$CANDIDATE_SHA" | tee .b1-artifacts/identidad-preview.txt

      - name: Configurar Node 22
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Configurar Java 21 para Firestore Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar secretos estrictamente de stage
        env:
          LAB_PASSWORD: ${{ secrets.LAB_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: |
          node <<'NODE'
          const required = [
            'LAB_PASSWORD',
            'FIREBASE_SERVICE_ACCOUNT',
            'NEXT_PUBLIC_FIREBASE_API_KEY',
            'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN',
            'NEXT_PUBLIC_FIREBASE_PROJECT_ID',
            'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET',
            'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID',
            'NEXT_PUBLIC_FIREBASE_APP_ID',
          ];
          for (const name of required) {
            if (!process.env[name]) throw new Error(`Falta el secreto protegido ${name}.`);
          }
          if (process.env.NEXT_PUBLIC_FIREBASE_PROJECT_ID !== process.env.STAGE_PROJECT_ID) {
            throw new Error('NEXT_PUBLIC_FIREBASE_PROJECT_ID no corresponde a STAGE.');
          }
          const account = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          if (account.project_id !== process.env.STAGE_PROJECT_ID) {
            throw new Error('FIREBASE_SERVICE_ACCOUNT no corresponde a STAGE.');
          }
          NODE

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Build de producción sobre el SHA exacto
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .b1-artifacts/build.log

      - name: Reglas Firestore con Java 21 y emulador
        run: |
          set -o pipefail
          npx --yes firebase-tools@15.19.0 emulators:exec --only firestore --project demo-ventanilla-lab "npm run test:rules" 2>&1 | tee .b1-artifacts/firestore-rules.log

      - name: Instalar Chromium en Linux
        run: npx playwright install --with-deps chromium

      - name: Preparar entorno efímero E2E de stage
        env:
          LAB_PASSWORD: ${{ secrets.LAB_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          node <<'NODE'
          const fs = require('node:fs');
          const password = process.env.LAB_PASSWORD;
          if (!password || /[\r\n]/.test(password)) throw new Error('LAB_PASSWORD no es apta para .env.stage.');
          const account = JSON.stringify(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT));
          fs.writeFileSync('.env.stage', [
            `LAB_PASSWORD=${password}`,
            `FIREBASE_SERVICE_ACCOUNT=${account}`,
            `NEXT_PUBLIC_FIREBASE_PROJECT_ID=${process.env.STAGE_PROJECT_ID}`,
            '',
          ].join('\n'), { mode: 0o600 });
          NODE
          cat > playwright.b1-preview.config.ts <<'EOF'
          import baseConfig from './playwright.config';

          export default {
            ...baseConfig,
            use: {
              ...baseConfig.use,
              baseURL: process.env.B1_PREVIEW_URL,
            },
          };
          EOF

      - name: E2E crítico contra el preview stage
        env:
          B1_PREVIEW_URL: ${{ env.PREVIEW_URL }}
        run: |
          set -o pipefail
          npx playwright test --config=playwright.b1-preview.config.ts e2e/01-ciclo-dorado.spec.ts e2e/06-perimetro-sin-sesion.spec.ts 2>&1 | tee .b1-artifacts/e2e.log

      - name: Smoke HTTP posterior al E2E
        run: |
          set -euo pipefail
          : > .b1-artifacts/smoke.log
          for RUTA in /api/health / /interno/login /consulta; do
            CODIGO="$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 "${PREVIEW_URL}${RUTA}" || true)"
            CODIGO="${CODIGO:-000}"
            echo "${RUTA} ${CODIGO}" | tee -a .b1-artifacts/smoke.log
            test "$CODIGO" = 200
          done

      - name: Publicar evidencia B1
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: b1-validacion-54256f5
          path: |
            .b1-artifacts/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Eliminar archivos efímeros y logs del emulador
        if: ${{ always() }}
        run: rm -f .env.stage playwright.b1-preview.config.ts firebase-debug.log firestore-debug.log
