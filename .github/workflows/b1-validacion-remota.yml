            echo "SMOKE=true"
            echo "CANDIDATE_SHA_EXACT=true"
          } | tee .node24-artifacts/resultado.txt

      - name: Sanear evidencia Node 24
        if: ${{ always() }}
        env:
          LAB_PASSWORD: ${{ secrets.LAB_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          OIDC_PROBES: ${{ steps.oidc_node24_probes.outputs.token }}
          OIDC_E2E_01: ${{ steps.oidc_node24_e2e_01.outputs.token }}
          OIDC_E2E_06: ${{ steps.oidc_node24_e2e_06.outputs.token }}
          OIDC_SMOKE: ${{ steps.oidc_node24_smoke.outputs.token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const raices = ['.node24-artifacts', 'playwright-report', 'test-results'];
          const secretos = [
            process.env.LAB_PASSWORD,
            process.env.FIREBASE_SERVICE_ACCOUNT,
            process.env.FIREBASE_API_KEY,
            process.env.OIDC_PROBES,
            process.env.OIDC_E2E_01,
            process.env.OIDC_E2E_06,
            process.env.OIDC_SMOKE,
          ].filter((valor) => typeof valor === 'string' && valor.length > 0);
          function archivosEn(ruta) {
            if (!fs.existsSync(ruta)) return [];
            return fs.readdirSync(ruta, { withFileTypes: true }).flatMap((entrada) => {
              const destino = path.join(ruta, entrada.name);
              return entrada.isDirectory() ? archivosEn(destino) : [destino];
            });
          }
          let eliminados = 0;
          for (const archivo of raices.flatMap(archivosEn)) {
            const normalizado = archivo.split(path.sep).join('/');
            const noPublicable =
              normalizado.endsWith('/trace.zip') ||
              normalizado.endsWith('/error-context.md') ||
              /(^|\/)playwright-report\/data\/.*\.(zip|md)$/.test(normalizado);
            const contenido = fs.readFileSync(archivo);
            const contieneSecreto = secretos.some((secreto) => contenido.includes(Buffer.from(secreto)));
            if (noPublicable || contieneSecreto) {
              fs.unlinkSync(archivo);
              eliminados += 1;
            }
          }
          for (const archivo of raices.flatMap(archivosEn)) {
            const contenido = fs.readFileSync(archivo);
            if (secretos.some((secreto) => contenido.includes(Buffer.from(secreto)))) {
              throw new Error(`Evidencia sensible no saneada en ${archivo}.`);
            }
          }
          fs.mkdirSync('.node24-artifacts', { recursive: true });
          fs.writeFileSync(
            '.node24-artifacts/sanitizacion.log',
            `archivos_eliminados=${eliminados}\nsecretos_verificados=${secretos.length}\n`,
            { mode: 0o600 },
          );
          console.log(`Evidencia Node 24 saneada: ${eliminados} archivo(s) eliminado(s).`);
          NODE

      - name: Publicar evidencia Node 24
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: node24-validacion-54256f5
          path: .node24-artifacts/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: Eliminar archivos efímeros Node 24
        if: ${{ always() }}
