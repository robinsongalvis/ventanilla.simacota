      - name: Smoke y health final con Node 24
        id: smoke_node24
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc_node24_smoke.outputs.token }}
        run: |
          set -euo pipefail
          node -e "const u=new URL(process.env.PREVIEW_URL);if(u.protocol!=='https:'||u.hostname!==process.env.PREVIEW_HOST||u.pathname!=='/')process.exit(1)"
          : > .node24-artifacts/smoke.log
          HEADERS="$(mktemp)"
          trap 'rm -f "$HEADERS"' EXIT
          for RUTA in /api/health / /interno/login /consulta; do
            : > "$HEADERS"
            CODIGO="$(curl --silent --show-error -D "$HEADERS" -o /dev/null -w '%{http_code}' --max-time 30 \
              -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
              "${PREVIEW_URL}${RUTA}" || true)"
            CODIGO="${CODIGO:-000}"
            echo "${RUTA} ${CODIGO}" | tee -a .node24-artifacts/smoke.log
            test "$CODIGO" = 200
            test -z "$(awk 'BEGIN{IGNORECASE=1} /^location:/ {print $2}' "$HEADERS" | tr -d '\r')"
          done

