          git restore -- e2e/01-ciclo-dorado.spec.ts e2e/06-perimetro-sin-sesion.spec.ts
          rm -f .env.stage playwright.node24-preview.config.ts e2e/b1-oidc-fixtures.ts
          rm -f .node24-workflow-source.yml firebase-debug.log firestore-debug.log
