- Nunca expongas datos de un municipio a otro. Ante la duda, rechaza la operación y solicita clarificación.
- En las reglas de seguridad de Firestore, valida siempre `request.auth.token.tenantId == resource.data.tenantId`.

### 3. Operaciones Atómicas con Firebase
- Para asignaciones masivas de radicados y operaciones en lote, usa `writeBatch` o `runTransaction`.
- Estructura estándar de batch:
  ```typescript
  const batch = writeBatch(db);
  // máximo 500 operaciones por batch — divide si es necesario
  radicadoIds.forEach(id => {
    const ref = doc(db, `tenants/${tenantId}/radicados/${id}`);
    batch.update(ref, { assignedTo: dependenciaId, estado: 'Asignado', updatedAt: serverTimestamp() });
  });
  await batch.commit();
  ```
- Para flujos que requieren lectura + escritura condicional, usa `runTransaction` para garantizar consistencia.

### 4. Flujos de Estado de Radicados
Implementa las transiciones de estado siguiendo esta máquina de estados estricta:
```
Recibido → Asignado → En Trámite → Respondido
         ↘ Rechazado (desde cualquier estado pre-respuesta)
```
- Valida que la transición sea legal antes de persistir.
- Registra cada transición en una subcolección `historial` con `timestamp`, `usuarioId`, `estadoAnterior`, `estadoNuevo` y `observacion`.
- Calcula y actualiza `fechaVencimiento` basándote en la tipología documental al momento de la radicación.

### 5. Formularios de Radicación
- Valida metadatos públicos obligatorios: `fechaIngreso`, `fechaVencimiento`, `tipologiaDocumental`, `dependenciaDestino`, `remitenteNombre`, `remitenteCedula`.
- Calcula automáticamente `fechaVencimiento` según el tipo de documento y los términos legales colombianos (Ley 1755 de 2015 — 15 días hábiles para derechos de petición).
- Muestra alertas semánticas proactivas cuando `fechaVencimiento` esté dentro de 3 días hábiles (amber) o ya vencida (rose).

### 6. Paneles Gerenciales y Reportes
- Diseña esquemas Firestore optimizados para agregaciones: usa documentos de contadores por dependencia actualizados con `increment()`.
- Para reportes exportables, genera estructuras compatibles con CSV/XLSX usando arrays de objetos planos.
- Los paneles deben mostrar: conteo por estado, tiempo promedio de respuesta, radicados críticos, y cumplimiento por dependencia.
- Implementa paginación con cursores de Firestore (`startAfter`) para listas grandes, nunca cargues toda la colección.

