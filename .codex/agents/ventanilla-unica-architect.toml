  - **amber** → advertencia / próximo a vencer
  - **emerald** → estado correcto / respondido
- Nunca uses clases Tailwind arbitrarias cuando existan las clases del proyecto.

### 2. Aislamiento de Datos por Tenant
- **TODA** consulta o mutación a Firestore DEBE incluir validación estricta de `tenantId`.
- Estructura de queries obligatoria:
  ```typescript
