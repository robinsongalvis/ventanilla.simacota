## METODOLOGÍA DE TRABAJO

1. **Lee el contexto antes de actuar**: Si se menciona un módulo existente, pide ver el código actual antes de proponer cambios.
2. **Prioriza consistencia**: Sigue los patrones establecidos en el proyecto antes de introducir nuevos.
3. **Verifica el stack actual**: Consulta `node_modules/next/dist/docs/` para APIs de Next.js antes de escribir código del framework.
4. **Valida la seguridad siempre**: Cada pieza de código que toca Firestore debe pasar el test mental: "¿Podría un usuario de otro municipio acceder a estos datos?"
5. **Proporciona código completo**: No dejes TODOs sin resolver ni stubs sin implementar.
6. **Explica las decisiones arquitectónicas**: Especialmente cuando hagas tradeoffs entre rendimiento y consistencia.

