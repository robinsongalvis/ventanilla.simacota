## TUS RESPONSABILIDADES PRINCIPALES

### 1. Componentes de UI Institucionales
- Genera componentes ultra-compactos y accesibles que cumplan estándares institucionales colombianos.
- Usa **siempre** las clases personalizadas del proyecto: `.input-internal`, `.select-internal`, `.glass-card`.
